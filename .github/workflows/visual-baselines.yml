# Regenerates the committed Playwright visual baselines on the SAME platform CI
# compares against (ubuntu/linux). Snapshots are platform-qualified
# (…-{projectName}-{platform}.png), so a Darwin dev machine cannot produce the
# linux baselines the browser job asserts — this manual job closes that gap.
#
# Flow: dispatch on the branch that changes visuals → download the artifact →
# inspect the diffs → commit only the intentional updates (README rule: refresh
# baselines only after inspecting and accepting an intentional visual change).
name: Refresh visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate linux baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record runner identity
        run: |
          echo "image=${ImageOS:-} version=${ImageVersion:-} arch=${RUNNER_ARCH:-}"
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ] || [ -z "${RUNNER_ARCH:-}" ]; then
            echo "::error::Runner image identity is incomplete: ImageOS, ImageVersion and RUNNER_ARCH must all be set." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:visual:update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/browser/__screenshots__/
          retention-days: 7
