# Makes the Playwright visual baselines inside the pinned Playwright image
# (tests/browser/visual-image.json, linux/amd64). `npm run test:visual:image-update`
# builds the site, then scripts/run-visual.mjs probes the image's browser build, renderer
# and fonts, writes them to tests/browser/__screenshots__/visual-environment.json, and
# rewrites every linux baseline in the image.
#
# Bootstrap: Website CI's browser job still compares the committed baselines on the
# runner's own Chromium, so this workflow's output is not yet what CI compares against.
# Its first run on main makes the image's linux set and manifest, and the change that
# commits them also moves the comparison into the image and deletes the darwin set. Until
# that change lands, do not commit this workflow's output on its own.
#
# Flow: dispatch → download the `visual-baselines` artifact → inspect the diffs → commit
# only the intentional updates, with the manifest (README rule: refresh baselines only
# after inspecting and accepting an intentional visual change). No bot commits.
name: Refresh visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate linux baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record runner identity
        run: |
          echo "image=${ImageOS:-} version=${ImageVersion:-} arch=${RUNNER_ARCH:-}"
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ] || [ -z "${RUNNER_ARCH:-}" ]; then
            echo "::error::Runner image identity is incomplete: ImageOS, ImageVersion and RUNNER_ARCH must all be set." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The build runs on the runner; the baselines are made inside the pinned image,
      # which ships its own Chromium, so the runner installs none.
      - name: Regenerate visual baselines in the pinned image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:visual:image-update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/browser/__screenshots__/
          if-no-files-found: error
          retention-days: 7
