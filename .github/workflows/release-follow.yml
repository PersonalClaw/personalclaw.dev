# Release-follow watchdog. Website CI only runs on push/PR, so a core release
# published AFTER the last website commit would leave the site quietly stale
# until someone happened to push. This runs the strict parity check on a schedule
# (and on demand) and opens/updates a single tracking issue when core has moved
# ahead — so "core published a tag" always produces a website obligation that is
# visible, not tribal knowledge.
name: Release follow

on:
  schedule:
    # Daily. Releases are infrequent; a day's latency is fine and keeps the
    # scheduled-run budget negligible.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-follow
  cancel-in-progress: true

jobs:
  check:
    name: Check the website against the newest core release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release parity (strict)
        id: parity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(npm run --silent validate:release-parity:strict 2>&1)
          status=$?
          set -e
          echo "$output"
          {
            echo "report<<PARITY_EOF"
            echo "$output"
            echo "PARITY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the tracking issue
        if: steps.parity.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.parity.outputs.report }}
          TITLE: "Website is behind the published core release"
        run: |
          body=$(printf 'The scheduled release-parity check failed — the website is not publishing the current core release.\n\n```\n%s\n```\n\nTo resolve: re-pin `sources/personalclaw.sources.json` to the new tag + commit, bump `package.json` to the matching version, refresh release-sensitive content, and run `npm run test:prepush`. See `docs/release-runbook.md`.\n\n_Updated by the release-follow workflow._\n' "$REPORT")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      - name: Fail the run when the website is stale
        if: steps.parity.outputs.status != '0'
        run: |
          echo "Release parity check failed — see the tracking issue." >&2
          exit 1
