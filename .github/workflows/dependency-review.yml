# Dependency review: GitHub's dependency comparison between a pull request's base and head, read
# over the API, failing on a dependency the pull request adds or moves to with a known
# vulnerability (PersonalClaw/PersonalClaw#4585).
#
# It runs on `pull_request`, the pull request's own copy, as feedback: GitHub's default policy
# stops `pull_request_target` runs in public repositories from 2026-12-02, and no workflow here
# runs on that event (tests/dependency-review.test.mjs holds that). It never checks out or runs
# the pull request's code: the action reads the base and head commits from the event and asks the
# dependency-graph API to compare them, with a read-only token. There is no checkout here at all;
# do not add one. A pull request that edits this file runs its own edited copy, so its green
# review proves nothing: that diff is the one to read.
#
# Not a required check: main's three required checks stay as they are, and a skip marker in a
# pull request's head commit stops them too, so a marked pull request cannot merge.
name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per pull request: a new head cancels the review of the old one.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Record runner identity
        run: |
          echo "image=${ImageOS:-} version=${ImageVersion:-} arch=${RUNNER_ARCH:-}"
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ] || [ -z "${RUNNER_ARCH:-}" ]; then
            exit 1
          fi
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
