<!doctype html>
<!--
  A page's social frame (#97): its own Open Graph image, made from the route's data (its title, its
  description, the release this site publishes) and one pinned capture of the product. The site's
  card, card.html beside this file, is the fallback for a page with no frame of its own.

  `npm run render:social-frames` fills the slots below from scripts/social-frames.mjs (as text and
  an image path, never as markup), renders each frame at 1200 x 630 in Playwright's Chromium with
  the site's own DM Sans, and stamps each frame's inputs and its PNG, which tests/social-frames.test.mjs
  holds the committed files to. Same inputs, same frame: nothing here reads the clock or the network.
  Colours: the card's coral field and coral ink, the one text pair allowed on coral (5.8:1), and the
  capture as it was taken.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "DM Sans Variable";
        font-weight: 100 1000;
        src: url("../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 64px 0 56px 72px;
        background: #ff6b5b;
        color: #3f1008;
        font-family: "DM Sans Variable", sans-serif;
      }
      .copy {
        display: flex;
        flex-direction: column;
        width: 520px;
        height: 100%;
        overflow: hidden;
      }
      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        margin: 0 0 40px;
        font-size: 26px;
        font-weight: 500;
      }
      .brand svg {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 60px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .description {
        margin: 0;
        font-size: 25px;
        font-weight: 450;
        line-height: 1.3;
      }
      .release {
        margin: auto 0 0;
        font-size: 22px;
        font-weight: 550;
      }
      /* The capture crosses the frame's right and bottom edges, as the System Window crosses the
         coral field on Home: the product, not a mock of it. */
      .capture {
        position: absolute;
        top: 96px;
        left: 640px;
        width: 720px;
        height: 450px;
        border: 3px solid #3f1008;
        border-radius: 8px;
        object-fit: cover;
        object-position: left top;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <p class="brand">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path
            fill="#3f1008"
            d="M256 16C106 76 46 226 46 226c0 45 60 90 90 90 90 0 180-195 135-285l-15-15zm45 15c30 60 0 135 0 135 120 30 120 180 75 330 75-75 90-150 90-210 0-90-15-225-165-255z"
          />
        </svg>
        PersonalClaw
      </p>
      <h1 data-slot="title"></h1>
      <p class="description" data-slot="description"></p>
      <p class="release" data-slot="release"></p>
    </div>
    <img class="capture" data-slot="capture" alt="" />
  </body>
</html>
