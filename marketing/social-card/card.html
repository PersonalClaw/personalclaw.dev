<!doctype html>
<!--
  The site's social card, public/brand/social-preview.png, as its source (#98). Render it with
  `npm run render:social-card`, which writes the PNG and marketing/social-card/stamp.json, the
  hashes tests/social-card.test.mjs holds the committed PNG to. Its words are held to the
  /compare ledger like every other description: the facts line says no more than the rows.
  Colours: the coral field and coral ink only, the one text pair allowed on coral (5.8:1).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "DM Sans Variable";
        font-weight: 100 1000;
        src: url("../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 600px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 56px;
        align-items: center;
        box-sizing: border-box;
        padding: 0 96px;
        background: #ff6b5b;
        color: #3f1008;
        font-family: "DM Sans Variable", sans-serif;
      }
      svg {
        display: block;
        width: 300px;
        height: 300px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 104px;
        font-weight: 300;
        line-height: 0.96;
        letter-spacing: -0.02em;
      }
      .line {
        margin: 0 0 28px;
        font-size: 40px;
        font-weight: 450;
        line-height: 1.15;
      }
      .line span,
      .facts span {
        white-space: nowrap;
      }
      .facts {
        margin: 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <path
        fill="#3f1008"
        d="M256 16C106 76 46 226 46 226c0 45 60 90 90 90 90 0 180-195 135-285l-15-15zm45 15c30 60 0 135 0 135 120 30 120 180 75 330 75-75 90-150 90-210 0-90-15-225-165-255z"
      />
    </svg>
    <main>
      <h1>PersonalClaw</h1>
      <p class="line"><span>One agentic OS.</span> <span>Your machine. Your rules.</span></p>
      <p class="facts" data-facts><span>Self-hosted. MIT licensed.</span> <span>No analytics, no crash reporting.</span></p>
    </main>
  </body>
</html>
