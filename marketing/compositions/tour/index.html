<!doctype html>
<!--
  The product tour (#96): /product plays it, click to play, with chapters and captions.

  One real recording of the released app, the `tour` clip in marketing/screenshots.manifest.json:
  core's demo click-path (docs/demo/CLICKPATH.md and capture_demo.mjs at the pinned tag), recorded
  at 1440 x 810 by `scripts/capture-tour.mjs` and staged into assets/ by `npm run render:videos`.
  Each beat of the path is one .beat here, in the path's order, and `data-media-start` and
  `data-duration` are where that beat begins and how long it runs in the take, from the
  tour.beats.json the recorder writes beside it.

  The cut keeps every view's load off screen. The take shows them where a view opens: Home's
  first second (the status bar still connecting), the chat's thread fading in, the loop's cockpit
  opening, the Library's search running (skeleton rows) and Home again at the close. They are the
  `tour` clip's `loading` in marketing/screenshots.manifest.json, and validate:marketing-manifest
  fails a clip that plays into one (scripts/clip-loading.mjs). So each beat starts once its view
  has loaded, and the knowledge beat cuts from the typed search straight to its results. The home
  this take was made on holds no artifact the agent made, so the path's artifact beat is not in
  it (scripts/capture-tour.mjs plays it only with ARTIFACT_NAME). A beat of two clips plays them
  back to back, with no dip between.

  Each beat carries its words, so the tracks cannot drift from the cut:
  - data-caption: what the beat shows, written into the captions track (nothing is spoken);
  - data-chapter and data-title: the chapter /product lists, written into the chapters track.
    The closing beat is no chapter of its own.
  render:videos writes both tracks from these beats (scripts/tour-tracks.mjs).

  Motion: each cut between beats dips through the theater's dark over 0.25 s each side, and the
  tour fades out over its last half second; the first frame is Home, already on screen. Those are
  paused Web Animations the runtime seeks, on a root marked `data-no-timeline`. Nothing loads from
  the network.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #121416;
      }
      #main {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #121416;
      }
      .beat {
        position: absolute;
        inset: 0;
      }
      .beat video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-no-timeline data-start="0" data-duration="65.42" data-width="1280" data-height="720">
      <div class="beat" data-chapter="home" data-title="Home, and what needs you"
        data-caption="Home counts what needs its owner, an approval and a workflow's choice, with an Answer beside them.">
        <video id="home" class="clip" src="assets/tour.webm" muted playsinline
          data-start="0" data-duration="7.5" data-media-start="2.5" data-track-index="1"></video>
      </div>
      <div class="beat" data-chapter="chat" data-title="A chat, in your own words"
        data-caption="A question in the owner's own words, answered on a local model: it reads the code, runs the tests and explains the failure.">
        <video id="chat" class="clip" src="assets/tour.webm" muted playsinline
          data-start="7.5" data-duration="13.68" data-media-start="11" data-track-index="2"></video>
      </div>
      <div class="beat" data-chapter="approval" data-title="The approval it stops on"
        data-caption="Before it edits a file, the run stops and asks: the tool, what it would change, its risk, and how far an answer is remembered. The answer is the owner's.">
        <video id="approval" class="clip" src="assets/tour.webm" muted playsinline
          data-start="21.18" data-duration="17.99" data-media-start="24.7" data-track-index="3"></video>
      </div>
      <div class="beat" data-chapter="loops" data-title="A goal loop and its findings"
        data-caption="A goal loop that ran six cycles on its own, and the finding it recorded in each.">
        <video id="loops" class="clip" src="assets/tour.webm" muted playsinline
          data-start="39.17" data-duration="13.4" data-media-start="43.2" data-track-index="4"></video>
      </div>
      <div class="beat" data-chapter="knowledge" data-title="The Library, searched locally"
        data-caption="Notes and links kept on this machine narrow as a word is typed.">
        <video id="knowledge" class="clip" src="assets/tour.webm" muted playsinline
          data-start="52.57" data-duration="3.45" data-media-start="58.2" data-track-index="5"></video>
        <video id="knowledge-results" class="clip" src="assets/tour.webm" muted playsinline
          data-start="56.02" data-duration="6.85" data-media-start="61.8" data-track-index="6"></video>
      </div>
      <div class="beat"
        data-caption="Back where it started: one gateway, one machine, owned by the person using it.">
        <video id="close" class="clip" src="assets/tour.webm" muted playsinline
          data-start="62.87" data-duration="2.55" data-media-start="70.05" data-track-index="7"></video>
      </div>
    </div>
    <script>
      // The runtime seeks every paused Web Animation to timeline time: each cut dips through the
      // dark, 0.25 s out of one beat and 0.25 s into the next, and the last beat fades out over its
      // last half second. Animation times are document time, so each beat's start is its delay. A
      // beat runs from its first clip's start to its last clip's end.
      const DIP = 0.25;
      const END = 0.5;
      const beats = [...document.querySelectorAll(".beat")];
      beats.forEach((beat, index) => {
        const clips = [...beat.querySelectorAll("video")];
        const start = Number(clips[0].dataset.start);
        const last = clips.at(-1);
        const length = Number(last.dataset.start) + Number(last.dataset.duration) - start;
        const fadeIn = index === 0 ? 0 : DIP;
        const fadeOut = index === beats.length - 1 ? END : DIP;
        const frames = [{ opacity: fadeIn ? 0 : 1 }];
        if (fadeIn) frames.push({ opacity: 1, offset: fadeIn / length });
        frames.push({ opacity: 1, offset: 1 - fadeOut / length }, { opacity: 0 });
        beat.animate(frames, { delay: start * 1000, duration: length * 1000, fill: "both" }).pause();
      });
    </script>
  </body>
</html>
